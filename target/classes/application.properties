spring.application.name=real-time-chat
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


server.port=8080


app.upload.dir=uploads

50 MB = 52428800 bytes
Keep this in sync with spring.servlet.multipart.max-file-size

app.upload.max-bytes=52428800
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB

app.webrtc.turn-urls=turn:turn.example.com:3478,turns:turn.example.com:5349

app.webrtc.stun-urls=stun:stun.l.google.com:19302
app.webrtc.turn-urls=${TURN_URLS:}
app.webrtc.turn-username=${TURN_USERNAME:}
app.webrtc.turn-credential=${TURN_CREDENTIAL:}



jwt.secret=${JWT_SECRET:change-this-to-a-long-random-base64-secret-change-this-to-a-long-random-base64-secret}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Outgoing mail (used for the "forgot password" reset link). Fill the real
# values in .env — see the MAIL_* placeholders there for a Gmail example.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# The "From" address on password-reset emails.
app.mail.from=${MAIL_FROM:no-reply@dusk.app}

# Base URL used to build the password-reset link that gets emailed to users.
# Point this at wherever the frontend is actually served (e.g. your deployed
# domain) — it must be reachable by whoever clicks the link.
# app.frontend-base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-base-url=${APP_BASE_URL:https://dusk-m7ma.onrender.com/}
