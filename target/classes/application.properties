spring.application.name=real-time-chat
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=8080

# File uploads (images, videos, audio, voice messages, documents shared in chat)
app.upload.dir=uploads
# Keep app.upload.max-bytes in sync with spring.servlet.multipart.max-file-size (50 MB = 52428800 bytes)
app.upload.max-bytes=52428800
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB

# Voice / video calls (WebRTC). STUN is enough for most networks; add a TURN relay
# (e.g. coturn) so calls also work behind strict firewalls / some mobile networks.
# Comma-separated lists, e.g. app.webrtc.turn-urls=turn:turn.example.com:3478,turns:turn.example.com:5349
app.webrtc.stun-urls=stun:stun.l.google.com:19302
app.webrtc.turn-urls=${TURN_URLS:}
app.webrtc.turn-username=${TURN_USERNAME:}
app.webrtc.turn-credential=${TURN_CREDENTIAL:}

# JWT (override via env vars JWT_SECRET / JWT_EXPIRATION in production)
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-base64-secret-change-this-to-a-long-random-base64-secret}
jwt.expiration=${JWT_EXPIRATION:86400000}
